<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>문장 페어 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600&family=Pretendard-fallback&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a;
    --surface:#1b1e23;
    --surface-2:#22262c;
    --border:#2c313a;
    --border-soft:#232730;
    --text:#e9e7e2;
    --text-dim:#9098a3;
    --text-faint:#5d6570;
    --source:#4fb3bf;
    --source-dim:#284046;
    --target:#e8a33d;
    --target-dim:#463522;
    --success:#6fbf8b;
    --success-dim:#20362a;
    --danger:#e2646f;
    --danger-dim:#3a2327;
    --radius-card:10px;
    --radius-chip:999px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard-fallback", "Malgun Gothic", sans-serif;
    --font-serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  }

  *{ box-sizing:border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    padding:28px 18px 80px;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
  }
  header h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13.5px;
    color:var(--text-dim);
    line-height:1.6;
    max-width:46ch;
  }
  .icon-btn{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .15s, color .15s, transform .15s;
  }
  .icon-btn:hover{ color:var(--text); border-color:#3a4048; }
  .icon-btn:active{ transform:scale(0.94); }
  .icon-btn:focus-visible, button:focus-visible, .chip:focus-visible{
    outline:2px solid var(--source);
    outline-offset:2px;
  }
  .icon-btn.spinning svg{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- API base (collapsible) ---------- */
  details.apibase{
    margin-bottom:22px;
    border:1px solid var(--border-soft);
    border-radius:var(--radius-card);
    background:var(--surface);
  }
  details.apibase summary{
    list-style:none;
    cursor:pointer;
    padding:11px 14px;
    font-size:12.5px;
    color:var(--text-faint);
    display:flex;
    align-items:center;
    gap:6px;
    user-select:none;
  }
  details.apibase summary::-webkit-details-marker{ display:none; }
  details.apibase summary::before{
    content:"›";
    display:inline-block;
    transition:transform .15s;
    font-size:15px;
  }
  details.apibase[open] summary::before{ transform:rotate(90deg); }
  .apibase-body{
    padding:0 14px 14px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .apibase-body input{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:7px;
    padding:8px 10px;
    color:var(--text);
    font-size:13px;
    font-family:inherit;
  }
  .apibase-body input:focus-visible{ outline:2px solid var(--source); outline-offset:1px; }
  .apibase-body button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:7px;
    padding:8px 12px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .apibase-body button:hover{ color:var(--text); }

  /* ---------- Section ---------- */
  section{ margin-bottom:26px; }
  .section-title{
    font-size:12.5px;
    color:var(--text-faint);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .count-tag{
    font-size:11.5px;
    color:var(--text-faint);
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    padding:2px 8px;
    border-radius:var(--radius-chip);
  }

  /* ---------- Sentence list ---------- */
  .sentence-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .sentence-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-card);
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:baseline;
  }
  .sentence-key{
    flex:0 0 auto;
    font-size:11.5px;
    color:var(--text-faint);
    font-variant-numeric:tabular-nums;
    min-width:26px;
  }
  .sentence-text{
    font-family:var(--font-serif);
    font-size:14.5px;
    line-height:1.75;
    color:var(--text);
    word-break:keep-all;
  }

  .empty-state, .loading-state, .error-state{
    padding:22px 16px;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:var(--radius-card);
    color:var(--text-dim);
    font-size:13.5px;
    line-height:1.6;
  }
  .error-state{ border-color:var(--danger); color:var(--danger); }
  .error-state button{
    margin-top:10px;
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    padding:6px 14px;
    border-radius:var(--radius-chip);
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---------- Pairing panel ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:18px;
  }
  .steps{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
    font-size:11.5px;
    color:var(--text-faint);
  }
  .step-dot{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .step-dot span.num{
    width:18px; height:18px;
    border-radius:50%;
    border:1px solid var(--border);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10.5px;
    color:var(--text-faint);
  }
  .step-dot.active span.num{ border-color:var(--source); color:var(--source); }
  .step-dot.active.is-target span.num{ border-color:var(--target); color:var(--target); }
  .step-dot.done span.num{ background:var(--surface-2); border-color:var(--text-faint); color:var(--text-dim); }
  .step-sep{ width:14px; height:1px; background:var(--border); }

  .panel-lead{
    font-size:13.5px;
    color:var(--text-dim);
    margin:0 0 14px;
  }

  .pick-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:340px;
    overflow-y:auto;
    padding-right:2px;
    margin-bottom:4px;
  }
  .pick-card{
    text-align:left;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:11px 13px;
    display:flex;
    gap:12px;
    align-items:baseline;
    cursor:pointer;
    font-family:inherit;
    color:var(--text);
    transition:border-color .12s, background .12s;
  }
  .pick-card:hover{ border-color:var(--text-faint); }
  .pick-card.mode-source:hover{ border-color:var(--source); }
  .pick-card.mode-target:hover{ border-color:var(--target); }
  .pick-card .sentence-key{ color:var(--text-faint); }
  .pick-card .sentence-text{ font-size:14px; }

  .picked-summary{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-card);
    margin-bottom:14px;
    font-size:13.5px;
  }
  .picked-summary.source{ background:var(--source-dim); }
  .picked-summary.target{ background:var(--target-dim); }
  .picked-summary .tag{
    flex:0 0 auto;
    font-size:11px;
    padding:2px 8px;
    border-radius:var(--radius-chip);
    font-weight:600;
  }
  .picked-summary.source .tag{ background:var(--source); color:#0b2226; }
  .picked-summary.target .tag{ background:var(--target); color:#2a1d0a; }
  .picked-summary .txt{
    flex:1;
    font-family:var(--font-serif);
    color:var(--text);
    line-height:1.6;
  }
  .picked-summary .change-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    font-family:inherit;
    padding:0;
  }
  .picked-summary .change-btn:hover{ color:var(--text); }

  .confirm-flow{ display:flex; flex-direction:column; gap:10px; }
  .confirm-arrow-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--text-faint);
    font-size:18px;
    margin:-2px 0 2px;
  }

  .confirm-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    font-family:inherit;
    font-size:13.5px;
    border-radius:var(--radius-chip);
    padding:10px 18px;
    cursor:pointer;
    border:1px solid transparent;
    transition:filter .12s, transform .1s;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:var(--target);
    color:#241a08;
    font-weight:600;
    flex:1;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; filter:none; }
  .btn-ghost{
    background:transparent;
    border-color:var(--border);
    color:var(--text-dim);
  }
  .btn-ghost:hover{ color:var(--text); border-color:#3a4048; }

  .result-banner{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:13px 14px;
    border-radius:var(--radius-card);
    font-size:13.5px;
    line-height:1.6;
    margin-bottom:14px;
  }
  .result-banner.ok{ background:var(--success-dim); color:var(--success); }
  .result-banner.fail{ background:var(--danger-dim); color:var(--danger); }
  .result-banner .rb-title{ font-weight:600; display:block; margin-bottom:2px; }
  .result-banner .rb-detail{ color:inherit; opacity:.85; font-size:12.5px; }
  .result-banner button{
    flex:0 0 auto;
    background:none;
    border:1px solid currentColor;
    color:inherit;
    border-radius:var(--radius-chip);
    padding:5px 12px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
  }

  .empty-hint{
    font-size:13.5px;
    color:var(--text-dim);
    padding:16px;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:var(--radius-card);
    line-height:1.6;
  }

  @media (max-width: 480px){
    body{ padding:20px 14px 70px; }
    header h1{ font-size:19px; }
    .pick-grid{ max-height:280px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>문장 페어 등록</h1>
      <p>확정된 문장을 조회하고, 한 문장을 다른 문장의 대상으로 지정해 등록합니다.</p>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="문장 다시 조회">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </header>

  <details class="apibase" id="apibaseDetails">
    <summary>API 기본 주소 설정 (선택)</summary>
    <div class="apibase-body">
      <input id="apiBaseInput" type="text" placeholder="비워두면 현재 페이지 기준 상대 경로로 요청합니다 (예: /llm/...)" autocomplete="off" spellcheck="false">
      <button id="apiBaseSave">저장</button>
    </div>
  </details>

  <section>
    <div class="section-title">
      <span>확정된 문장</span>
      <span class="count-tag" id="countTag">0개</span>
    </div>
    <div id="listArea">
      <div class="loading-state">문장을 불러오는 중입니다…</div>
    </div>
  </section>

  <section id="pairingSection" hidden>
    <div class="section-title"><span>페어 등록</span></div>
    <div class="panel" id="panelArea"></div>
  </section>

</div>

<script>
(function(){
  var STORAGE_KEY = 'qa-pairing-tool:apiBase';
  var apiBase = '';
  try { apiBase = localStorage.getItem(STORAGE_KEY) || ''; } catch(e) {}

  var apiBaseInput = document.getElementById('apiBaseInput');
  var apiBaseSave = document.getElementById('apiBaseSave');
  apiBaseInput.value = apiBase;
  apiBaseSave.addEventListener('click', function(){
    apiBase = apiBaseInput.value.trim().replace(/\/$/, '');
    try { localStorage.setItem(STORAGE_KEY, apiBase); } catch(e) {}
    document.getElementById('apibaseDetails').open = false;
    load();
  });

  function url(path){ return apiBase + path; }

  var listArea = document.getElementById('listArea');
  var countTag = document.getElementById('countTag');
  var pairingSection = document.getElementById('pairingSection');
  var panelArea = document.getElementById('panelArea');
  var refreshBtn = document.getElementById('refreshBtn');

  var sentences = {};   // key(string) -> text
  var keys = [];
  var pick = { source: null, target: null };
  var lastResult = null; // { ok, sn, target, n, resTarget } or { ok:false, error }
  var posting = false;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function setLoading(spin){
    refreshBtn.classList.toggle('spinning', !!spin);
  }

  function load(){
    setLoading(true);
    listArea.innerHTML = '<div class="loading-state">문장을 불러오는 중입니다…</div>';
    pairingSection.hidden = true;

    fetch(url('/llm/commited-sentence'), { method: 'GET' })
      .then(function(res){
        if (!res.ok) throw new Error('요청이 실패했습니다 (status ' + res.status + ')');
        return res.json();
      })
      .then(function(data){
        sentences = data || {};
        keys = Object.keys(sentences);
        renderList();
        pick = { source: null, target: null };
        lastResult = null;
        renderPanel();
      })
      .catch(function(err){
        listArea.innerHTML =
          '<div class="error-state">문장을 불러오지 못했습니다.<br>' + escapeHtml(err.message) +
          '<br><button id="retryBtn">다시 시도</button></div>';
        countTag.textContent = '0개';
        var retryBtn = document.getElementById('retryBtn');
        if (retryBtn) retryBtn.addEventListener('click', load);
      })
      .finally(function(){ setLoading(false); });
  }

  function renderList(){
    countTag.textContent = keys.length + '개';
    if (keys.length === 0){
      listArea.innerHTML = '<div class="empty-state">아직 확정된 문장이 없습니다.</div>';
      return;
    }
    var html = '<div class="sentence-list">';
    keys.forEach(function(k){
      html += '<div class="sentence-card">' +
        '<span class="sentence-key">#' + escapeHtml(k) + '</span>' +
        '<span class="sentence-text">' + escapeHtml(sentences[k]) + '</span>' +
        '</div>';
    });
    html += '</div>';
    listArea.innerHTML = html;
  }

  function stepsHtml(){
    var s1 = pick.source === null ? 'active' : 'done';
    var s2 = pick.source === null ? '' : (pick.target === null ? 'active is-target' : 'done');
    var s3 = (pick.source !== null && pick.target !== null) ? 'active' : '';
    return '<div class="steps">' +
      '<div class="step-dot ' + s1 + '"><span class="num">1</span><span>원본 선택</span></div>' +
      '<div class="step-sep"></div>' +
      '<div class="step-dot ' + s2 + '"><span class="num">2</span><span>대상 선택</span></div>' +
      '<div class="step-sep"></div>' +
      '<div class="step-dot ' + s3 + '"><span class="num">3</span><span>확인 및 등록</span></div>' +
      '</div>';
  }

  function pickGridHtml(mode, excludeKey){
    var html = '<div class="pick-grid">';
    keys.forEach(function(k){
      if (excludeKey !== undefined && k === excludeKey) return;
      html += '<button type="button" class="pick-card mode-' + mode + '" data-key="' + escapeHtml(k) + '">' +
        '<span class="sentence-key">#' + escapeHtml(k) + '</span>' +
        '<span class="sentence-text">' + escapeHtml(sentences[k]) + '</span>' +
        '</button>';
    });
    html += '</div>';
    return html;
  }

  function resultBannerHtml(){
    if (!lastResult) return '';
    if (lastResult.ok){
      return '<div class="result-banner ok">' +
        '<div style="flex:1"><span class="rb-title">등록을 완료했습니다.</span>' +
        '<span class="rb-detail">원본 #' + escapeHtml(lastResult.sn) + ' → 대상 #' + escapeHtml(lastResult.target) + '</span></div>' +
        '<button data-action="new-pair">새 페어 만들기</button>' +
        '</div>';
    }
    return '<div class="result-banner fail">' +
      '<div style="flex:1"><span class="rb-title">' + escapeHtml(lastResult.title || '등록에 실패했습니다.') + '</span>' +
      '<span class="rb-detail">' + escapeHtml(lastResult.detail || '') + '</span></div>' +
      '<button data-action="new-pair">다시 시도</button>' +
      '</div>';
  }

  function renderPanel(){
    if (keys.length < 2){
      pairingSection.hidden = false;
      panelArea.innerHTML = '<div class="empty-hint">페어를 만들려면 문장이 2개 이상 필요합니다.<br>현재 ' + keys.length + '개 확인됨.</div>';
      return;
    }
    pairingSection.hidden = false;

    var html = stepsHtml();
    html += resultBannerHtml();

    if (posting){
      html += '<div class="panel-lead">등록 요청을 보내는 중입니다…</div>';
      panelArea.innerHTML = html;
      return;
    }

    if (pick.source === null){
      html += '<p class="panel-lead">기준이 될 원본 문장을 선택하세요.</p>';
      html += pickGridHtml('source');
    } else if (pick.target === null){
      html += '<div class="picked-summary source">' +
        '<span class="tag">원본</span>' +
        '<span class="txt">#' + escapeHtml(pick.source) + ' · ' + escapeHtml(sentences[pick.source]) + '</span>' +
        '<button class="change-btn" data-action="change-source">변경</button>' +
        '</div>';
      html += '<p class="panel-lead">이 문장의 대상으로 지정할 문장을 선택하세요.</p>';
      html += pickGridHtml('target', pick.source);
    } else {
      html += '<div class="confirm-flow">';
      html += '<div class="picked-summary source">' +
        '<span class="tag">원본</span>' +
        '<span class="txt">#' + escapeHtml(pick.source) + ' · ' + escapeHtml(sentences[pick.source]) + '</span>' +
        '<button class="change-btn" data-action="change-source">변경</button>' +
        '</div>';
      html += '<div class="confirm-arrow-row">↓</div>';
      html += '<div class="picked-summary target">' +
        '<span class="tag">대상</span>' +
        '<span class="txt">#' + escapeHtml(pick.target) + ' · ' + escapeHtml(sentences[pick.target]) + '</span>' +
        '<button class="change-btn" data-action="change-target">변경</button>' +
        '</div>';
      html += '<div class="confirm-actions">' +
        '<button class="btn btn-ghost" data-action="cancel">취소</button>' +
        '<button class="btn btn-primary" data-action="submit">이 페어로 등록</button>' +
        '</div>';
      html += '</div>';
    }

    panelArea.innerHTML = html;
  }

  panelArea.addEventListener('click', function(e){
    var pickBtn = e.target.closest('.pick-card');
    if (pickBtn){
      var key = pickBtn.getAttribute('data-key');
      if (pick.source === null){ pick.source = key; }
      else if (pick.target === null){ pick.target = key; }
      renderPanel();
      return;
    }
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    if (action === 'change-source'){ pick.source = null; pick.target = null; renderPanel(); }
    else if (action === 'change-target'){ pick.target = null; renderPanel(); }
    else if (action === 'cancel'){ pick = { source: null, target: null }; renderPanel(); }
    else if (action === 'new-pair'){ pick = { source: null, target: null }; lastResult = null; renderPanel(); }
    else if (action === 'submit'){ submitPair(); }
  });

  function submitPair(){
    var sn = pick.source, target = pick.target;
    posting = true;
    renderPanel();

    fetch(url('/llm/qa/' + encodeURIComponent(sn) + '/' + encodeURIComponent(target)), {
      method: 'POST'
    })
      .then(function(res){
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function(data){
        var n = data && data.n;
        var resTarget = data && data.target;
        var ok = String(n) === String(sn) && String(resTarget) === String(target);
        if (ok){
          lastResult = { ok: true, sn: sn, target: target };
        } else {
          lastResult = {
            ok: false,
            title: '서버 응답이 요청과 일치하지 않습니다.',
            detail: '요청: 원본 #' + sn + ' → 대상 #' + target + ' / 응답: n=' + n + ', target=' + resTarget
          };
        }
      })
      .catch(function(err){
        lastResult = { ok: false, title: '등록 요청이 실패했습니다.', detail: err.message };
      })
      .finally(function(){
        posting = false;
        pick = { source: null, target: null };
        renderPanel();
      });
  }

  refreshBtn.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
